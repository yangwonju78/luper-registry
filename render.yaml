services:
  - type: web
    name: luper-registry-v03
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: luper-registry-db
          property: connectionString
databases:
  - name: luper-registry-db
    databaseName: luper
    user: luper
