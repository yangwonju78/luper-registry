services:
  - type: web
    name: luper-registry-v03
    runtime: docker
    healthCheckPath: /health
    disk:
      name: luper-registry-images
      mountPath: /app/DB
      sizeGB: 1
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: LUPER_DB_DIR
        value: /app/DB
      - key: DATABASE_URL
        fromDatabase:
          name: luper-registry-db
          property: connectionString

databases:
  - name: luper-registry-db
    databaseName: luper
    user: luper
